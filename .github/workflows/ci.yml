name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these same checks before publishing.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: lontar
          MYSQL_DATABASE: lontar
          MYSQL_USER: lontar
          MYSQL_PASSWORD: lontar
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ulontar -plontar" --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lontar
          POSTGRES_PASSWORD: lontar
          POSTGRES_DB: lontar
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lontar -d lontar"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://lontar:lontar@127.0.0.1:3306/lontar
      TEST_DATABASE_URL: mysql://lontar:lontar@127.0.0.1:3306/lontar_test
      POSTGRES_URL: postgres://lontar:lontar@127.0.0.1:5432/lontar
      TEST_POSTGRES_URL: postgres://lontar:lontar@127.0.0.1:5432/lontar_test
      BETTER_AUTH_TRUSTED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000,http://127.0.0.1:3005,http://localhost:3005
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # Lowest version allowed by "engines" in package.json.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify example migrations are up to date
        run: |
          pnpm --filter next-blog migrate:create
          if [ -n "$(git status --porcelain examples/next-blog/migrations)" ]; then
            echo "Uncommitted migration changes detected in examples/next-blog/migrations"
            git status --porcelain examples/next-blog/migrations
            exit 1
          fi
      # Installs the packed tarballs outside the workspace, the way users get them.
      - name: Pack and smoke-test the packages
        run: |
          pnpm pack:packages "$RUNNER_TEMP/packed"
          pnpm smoke:packages "$RUNNER_TEMP/packed"
      - run: pnpm test
      - name: Install Playwright Chromium
        run: pnpm --filter next-blog exec playwright install chromium --with-deps
      - name: Run E2E tests
        run: pnpm test:e2e
