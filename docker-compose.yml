# Local databases for development and integration tests.
# Credentials match .env.example; nothing here is meant for production.
services:
  mysql:
    image: mysql:8.4
    container_name: lontar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lontar
      MYSQL_DATABASE: lontar
      MYSQL_USER: lontar
      MYSQL_PASSWORD: lontar
    ports:
      - '3306:3306'
    volumes:
      - lontar-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ulontar', '-plontar']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    container_name: lontar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lontar
      POSTGRES_PASSWORD: lontar
      POSTGRES_DB: lontar
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - lontar-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lontar -d lontar']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  lontar-mysql-data:
  lontar-postgres-data:
